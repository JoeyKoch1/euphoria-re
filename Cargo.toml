[workspace]
resolver = "3"
members = ["aero", "apk", "capi", "dump", "formats", "engine", "plugins", "sql", "cli", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aero = { path = "aero" }
euphoria-apk = { path = "apk" }
euphoria-capi = { path = "capi" }
euphoria-dump = { path = "dump" }
euphoria-formats = { path = "formats" }
euphoria-engine = { path = "engine" }
euphoria-plugins = { path = "plugins" }
euphoria-sql = { path = "sql" }
anyhow = "1.0"
base64 = "0.23"
crc32fast = "1.5"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
object = "0.40"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
webpki-roots = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"

[profile.release]
lto = "thin"
